name: Phase 1.1 ROS 2 qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usv-phase11-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phase11:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PHASE11_IMAGE: usv-guidance-phase11:gha
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p phase1_ros2/phase11_out
          docker version | tee phase1_ros2/phase11_out/docker_version.log
          docker info | tee phase1_ros2/phase11_out/docker_info.log
          df -h | tee phase1_ros2/phase11_out/disk_before.log
          free -h | tee phase1_ros2/phase11_out/memory.log

      - name: Pull and identify ROS 2 base image
        shell: bash
        run: |
          set -euxo pipefail
          docker pull ros:jazzy-ros-base-noble \
            | tee phase1_ros2/phase11_out/docker_pull.log
          docker image inspect ros:jazzy-ros-base-noble \
            > phase1_ros2/phase11_out/base_image_inspect.json
          docker image inspect ros:jazzy-ros-base-noble \
            --format '{{json .RepoDigests}}' \
            > phase1_ros2/phase11_out/base_image_repo_digests.json

      - name: Build Phase 1.1 image
        shell: bash
        run: |
          set -o pipefail
          docker build \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -f phase1_ros2/Dockerfile.phase11 \
            -t "${PHASE11_IMAGE}" phase1_ros2 \
            2>&1 | tee phase1_ros2/phase11_out/docker_build.log

      - name: Run Phase 1.1 build and tests
        id: qualification
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          chmod -R a+rwX phase1_ros2
          docker run --rm \
            --user 0:0 \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/phase1_ros2,target=/work" \
            "${PHASE11_IMAGE}" \
            bash /work/scripts/run_phase11_build.sh \
            2>&1 | tee phase1_ros2/phase11_out/docker_run.log
          rc=${PIPESTATUS[0]}
          echo "qualification_rc=${rc}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Package Phase 1.1 evidence
        if: always()
        shell: bash
        run: |
          set +e
          cd phase1_ros2
          python3 scripts/make_phase11_report.py phase11_out
          rm -f PHASE11_RETURN.zip PHASE11_RETURN.zip.sha256
          (cd phase11_out && zip -qr ../PHASE11_RETURN.zip .)
          sha256sum PHASE11_RETURN.zip > PHASE11_RETURN.zip.sha256
          df -h > phase11_out/disk_after.log
          exit 0

      - name: Upload Phase 1.1 evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: phase11-return-${{ github.run_id }}
          path: |
            phase1_ros2/PHASE11_RETURN.zip
            phase1_ros2/PHASE11_RETURN.zip.sha256
            phase1_ros2/phase11_out
          if-no-files-found: error
          retention-days: 30

      - name: Enforce qualification result
        if: always()
        shell: bash
        run: |
          rc='${{ steps.qualification.outputs.qualification_rc }}'
          if [[ -z "$rc" ]]; then
            echo 'Phase 1.1 did not reach the qualification step.' >&2
            exit 90
          fi
          exit "$rc"
